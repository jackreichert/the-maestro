name: gates

# The script is checked out from the pull request's base SHA, not the head, so the
# writer cannot edit the gate in the same pull request. The diff is the head.
# Until this workflow is on the base branch, the job fails closed rather than
# running a copy from the pull request. Branch protection is not set here.
on:
  pull_request:

permissions:
  contents: read

jobs:
  gates:
    name: gates
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout the base ref
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          fetch-depth: 0

      - name: Fetch the pull request head
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: git fetch --no-tags origin "pull/${PR_NUMBER}/head:refs/ci-gates/head"

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Run size, body, smells, and leak gates from the base ref
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
          REPO_OWNER: ${{ github.repository_owner }}
          # Customer and org names the diff must not carry. A secret, so the list is never committed.
          # Unset, the leak gate fails; LEAK_GATE_BUILTIN_ONLY=1 (a repository variable) accepts built-in checks alone and says so in the log.
          LEAK_TERMS: ${{ secrets.LEAK_TERMS }}
          LEAK_GATE_BUILTIN_ONLY: ${{ vars.LEAK_GATE_BUILTIN_ONLY }}
        run: |
          if [ ! -f scripts/ci-gates.ts ]; then
            echo "scripts/ci-gates.ts is not on the base ref. Refusing to run a copy from the pull request."
            exit 1
          fi
          printf '%s' "$PR_TITLE" > "$RUNNER_TEMP/pr-title.txt"
          printf '%s' "$PR_BODY" > "$RUNNER_TEMP/pr-body.md"
          set +e
          node scripts/ci-gates.ts \
            --repo . \
            --base "$BASE_SHA" \
            --base-name "$BASE_REF" \
            --head refs/ci-gates/head \
            --title-file "$RUNNER_TEMP/pr-title.txt" \
            --body-file "$RUNNER_TEMP/pr-body.md" | tee "$RUNNER_TEMP/gates.out"
          code=${PIPESTATUS[0]}
          set -e
          # Size limits are waived for this owner's repos, and only for a plain size failure: exit code 1, every
          # other gate printed no FAIL (ci-gates only exits 1 after printing every gate), and the size line says FAIL. A crash or git error (exit 2, or a gate that
          # never printed) is not waived, so it can never pass the leak check silently.
          if [ "$code" = 1 ] && [ "$REPO_OWNER" = "jackreichert" ] \
            && grep -q '^size: .*FAIL$' "$RUNNER_TEMP/gates.out" \
            && grep -q '^body: PASS$' "$RUNNER_TEMP/gates.out" \
            && grep -q '^smells: PASS$' "$RUNNER_TEMP/gates.out" \
            && ! grep -q '^leaks: FAIL$' "$RUNNER_TEMP/gates.out"; then
            echo "size: waived for jackreichert repos"
            exit 0
          fi
          exit "$code"
